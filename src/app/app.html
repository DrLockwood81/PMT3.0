<!-- DATE SITS ABOVE THE NAVY BANNER -->
<div class="global-date-container">
  <h2>{{ getDate() }}</h2>
</div>

<header>
  <h1>{{ title() }}</h1>
  
  <!-- MINI PERSISTENT AUDIO PLAYER -->
<div class="persistent-player">
  <span class="player-label">🎧 Focus Beats</span>
  <audio controls loop preload="auto">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
</div>
  <nav>
    <a routerLink="/kpi" routerLinkActive="active">📊 Daily Input Dashboard</a>
    <a routerLink="/follow-up" routerLinkActive="active">🔔 Follow-Ups</a>
  </nav>
</header>

<main>
  <router-outlet />
</main>
